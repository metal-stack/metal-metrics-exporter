apiVersion: apps/v1
kind: Deployment
metadata:
  name: metal-metrics-exporter
  labels:
    app: metal-metrics-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metal-metrics-exporter
  template:
    metadata:
      labels:
        app: metal-metrics-exporter
    spec:
      automountServiceAccountToken: false
      containers:
        - name: metal-metrics-exporter
          command:
            - /metal-metrics-exporter
          args:
            - start
          image: ghcr.io/metal-stack/metal-metrics-exporter:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9080
              name: metrics
          env:
            - name: METAL_API_URL
              valueFrom:
                secretKeyRef:
                  name: metal-metrics-exporter-config
                  key: url
            - name: METAL_API_TOKEN_FILE
              value: /var/run/secrets/metal-metrics-exporter-config/token
          volumeMounts:
            - mountPath: /var/run/secrets/metal-metrics-exporter-config
              name: metal-metrics-exporter-config
          securityContext:
            runAsUser: 999
            allowPrivilegeEscalation: false
            runAsNonRoot: true
      volumes:
        - name: metal-metrics-exporter-config
          secret:
            defaultMode: 420
            secretName: metal-metrics-exporter-config
